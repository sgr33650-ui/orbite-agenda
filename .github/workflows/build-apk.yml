name: Construire l'APK Orbite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'application
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk Orbite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Orbite-apk
          path: Orbite.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Orbite 1.0.${{ github.run_number }}
          body: |
            Téléchargez **Orbite.apk** ci-dessous et ouvrez-le sur votre téléphone Android pour l'installer ou le mettre à jour.
          files: Orbite.apk
          make_latest: true
